AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  SuggestExtensions: false
  Exclude:
    - 'spec/fixtures/**/*'

plugins:
  - rubocop-rspec
  - rubocop-performance

Style/FrozenStringLiteralComment:
  EnforcedStyle: always

Style/Documentation:
  Enabled: false

# Gem convention: dev deps belong in gemspec so gem installs work without a Gemfile
Gemspec/DevelopmentDependencies:
  Enabled: false

Metrics/MethodLength:
  Max: 15
  Exclude:
    - 'lib/banco/cli.rb'
    - 'lib/banco/formatter/text.rb'

Metrics/AbcSize:
  Exclude:
    - 'lib/banco/cli.rb'
    - 'lib/banco/formatter/text.rb'

Metrics/BlockLength:
  Exclude:
    - 'bin/banco'

Metrics/ParameterLists:
  Exclude:
    - 'lib/banco/transaction.rb'

Metrics/ClassLength:
  Max: 150

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/banco/formatter/text.rb'

# Allow up to 2 expectations per example for related assertions
RSpec/MultipleExpectations:
  Max: 2

RSpec/ExampleLength:
  Max: 10
